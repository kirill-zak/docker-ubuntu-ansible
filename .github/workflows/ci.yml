---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        version_branch: [20.04, 22.04, 24.04]
    uses: ./.github/workflows/test-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}