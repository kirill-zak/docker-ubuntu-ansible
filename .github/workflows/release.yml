---
name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Validate tag format (vx.x[.x])
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "Checking tag: ${tag}"
          if ! echo "$tag" | grep -Eq '^v?[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?$'; then
            echo "::error::Invalid release tag '${tag}'."
            echo "::error::Expected x.x or x.x.x, optional 'v' prefix (e.g., 1.0.10, 10.1.12, 2.20, v1.12.1, v1.2), no pre-release suffixes."
            exit 1
          fi

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        version_branch: [18.04, 20.04, 22.04, 24.04]
    uses: ./.github/workflows/test-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}

  release:
    name: Release ${{ matrix.version_branch }}
    needs: [test, validate-tag]
    if: ${{ needs.test.result == 'success' && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version_branch: 18.04
            platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/s390x
          - version_branch: 20.04
            platforms: linux/amd64,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/s390x
          - version_branch: 22.04
            platforms: linux/amd64,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/s390x
          - version_branch: 24.04
            platforms: linux/amd64,linux/arm/v7,linux/arm64/v8,linux/ppc64le,linux/s390x
            additional_tags: latest
    uses: ./.github/workflows/build-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}
      platforms: ${{ matrix.platforms }}
      additional_tags: ${{ matrix.additional_tags }}
      push: true
    secrets: inherit