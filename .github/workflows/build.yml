---
name: Build
on: workflow_dispatch

permissions:
  contents: read

jobs:
  test-build:
    name: Build ${{ matrix.version_branch }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm/v7
          - linux/arm64/v8
          - linux/ppc64le
          - linux/s390x
        version_branch: [18.04, 20.04, 22.04, 24.04]
        include:
          - version_branch: 18.04
            platform: linux/386
    uses: ./.github/workflows/build-image.yml
    with:
      version_branch: ${{ matrix.version_branch }}
      platforms: ${{ matrix.platform }}
      push: false